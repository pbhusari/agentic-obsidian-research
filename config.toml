[pipeline]
top_n = 25
months_back = 3
min_citations = 0
venues = ["cs.CR", "cs.AI", "cs.LG"]
extra_queries = [
  "agentic security",
  "LLM tool use attack",
  "prompt injection multi-agent",
  "MCP model context protocol exploit",
  "jailbreak agent",
  "LLM orchestration security",
  "autonomous agent red team"
]

[llm]
provider = "cerebras"
fast_model = "cerebras/gemma2-9b-it"
synthesis_model = "cerebras/deepseek-r1-distill-llama-70b"
temperature = 0.2
max_tokens_extraction = 1024
max_tokens_synthesis = 16000
max_concurrent = 10

[obsidian]
vault_path = "./vault"
use_dataview = true
use_callouts = true
tags_prefix = "vantage"
link_style = "wikilink"

[output]
overwrite_existing = false
emit_synthesis_log = true
