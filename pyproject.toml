[project]
name = "vantage"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "typer>=0.12",
  "litellm>=1.40",
  "arxiv>=2.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "toml>=0.10",
  "rich>=13",
  "python-dotenv>=1.0",
  "tenacity>=8.3",
  "tqdm>=4.66",
]

[project.scripts]
vantage = "vantage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
